# ===================================================
# VIRALCUT AI — Render 24/7 Production Blueprint
# Deploy via: Render Dashboard -> Blueprints -> New Blueprint Instance
# ===================================================

services:
  # 1. Frontend Web Service
  - type: web
    name: viralcut-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://viralcut-backend.onrender.com/api/*
      - type: rewrite
        source: /storage/*
        destination: https://viralcut-backend.onrender.com/storage/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20

  # 2. Backend API Web Service
  - type: web
    name: viralcut-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard # Always-on production resource
    healthCheckPath: /health
    disk:
      name: media-storage
      mountPath: /app/storage
      sizeGB: 50
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # Set securely in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_URL
        fromDatabase:
          name: viralcut-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: viralcut-redis
          property: connectionString
      - key: STORAGE_PROVIDER
        value: local

  # 3. Independent Background Worker Service (24/7 Video Processing Engine)
  - type: worker
    name: viralcut-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard # Always-on production resource with dedicated CPU & RAM
    dockerCommand: celery -A app.tasks.celery_app worker --loglevel=info -c 2
    disk:
      name: media-storage
      mountPath: /app/storage
      sizeGB: 50
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        fromService:
          type: web
          name: viralcut-backend
          property: envVars.SECRET_KEY
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: viralcut-backend
          property: envVars.GEMINI_API_KEY
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_URL
        fromDatabase:
          name: viralcut-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: viralcut-redis
          property: connectionString
      - key: STORAGE_PROVIDER
        value: local

# Managed Databases & Queue
databases:
  - name: viralcut-postgres
    plan: standard
    databaseName: viralcut
    user: viralcut_user

  - name: viralcut-redis
    plan: standard
    ipAllowList: [] # Private internal network access only
